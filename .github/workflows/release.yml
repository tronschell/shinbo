name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'ci' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: skip when this version is already released
        id: version
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          TAG="v$(node -p 'require("./package.json").version')"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released; bump the root package.json version on dev to publish again."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: download the release candidate
        if: github.event_name == 'workflow_run' && steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: shinbo-release-candidate
          path: ${{ runner.temp }}/shinbo-release-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: download the Windows release candidate
        if: github.event_name == 'workflow_run' && steps.version.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: shinbo-release-candidate-windows
          path: ${{ runner.temp }}/shinbo-release-candidate-windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - uses: actions/setup-python@v6
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: '3.12'

      - name: verify and extract the release candidate
        if: github.event_name == 'workflow_run' && steps.version.outputs.skip != 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/shinbo-release-candidate"
          ARCHIVE_NAME="Shinbo-darwin-arm64.zip"
          CHECKSUM_NAME="Shinbo-darwin-arm64.zip.sha256"
          ARCHIVE="$CANDIDATE/$ARCHIVE_NAME"
          CHECKSUM="$CANDIDATE/$CHECKSUM_NAME"
          MANIFEST="$CANDIDATE/manifest.json"
          test -f "$ARCHIVE"
          test -f "$CHECKSUM"
          test -f "$MANIFEST"
          SOURCE_SHA="$(jq -er '.source_sha | strings' "$MANIFEST")"
          VERSION="$(jq -er '.version | strings' "$MANIFEST")"
          RUN_ID="$(jq -er '.workflow_run_id | tostring' "$MANIFEST")"
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          test "$SOURCE_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$RUN_ID" = "$EXPECTED_RUN_ID"
          test "$(awk 'NF == 2 { print $2; next } { exit 1 }' "$CHECKSUM")" = "$ARCHIVE_NAME"
          (cd "$CANDIDATE" && shasum -a 256 -c "$CHECKSUM_NAME")
          mkdir -p desktop/release
          ditto -x -k "$ARCHIVE" desktop/release
          APP="desktop/release/Shinbo-darwin-arm64/Shinbo.app"
          test -x "$APP/Contents/MacOS/Shinbo"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(plutil -extract CFBundleVersion raw -o - "$APP/Contents/Info.plist")" = "$EXPECTED_VERSION"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = 'com.tronschell.emma'

      - name: verify and stage the Windows release candidate
        if: github.event_name == 'workflow_run' && steps.version.outputs.skip != 'true'
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/shinbo-release-candidate-windows"
          MANIFEST="$CANDIDATE/manifest.json"
          test -f "$MANIFEST"
          EXPECTED_VERSION="$(node -p 'require("./package.json").version')"
          test "$(jq -er '.source_sha | strings' "$MANIFEST")" = "$EXPECTED_SOURCE_SHA"
          test "$(jq -er '.version | strings' "$MANIFEST")" = "$EXPECTED_VERSION"
          test "$(jq -er '.workflow_run_id | tostring' "$MANIFEST")" = "$EXPECTED_RUN_ID"
          SETUP="Shinbo-$EXPECTED_VERSION-win32-x64-Setup.exe"
          test -f "$CANDIDATE/$SETUP"
          test -f "$CANDIDATE/RELEASES"
          test -f "$CANDIDATE/SHA256SUMS"
          test "$(ls -1 "$CANDIDATE"/*.nupkg | wc -l | tr -d ' ')" = 1
          NUPKG="$(basename "$(ls -1 "$CANDIDATE"/*.nupkg)")"
          test "$(awk 'NF == 3 { print $2; next } { exit 1 }' "$CANDIDATE/RELEASES")" = "$NUPKG"
          (cd "$CANDIDATE" && shasum -a 256 -c SHA256SUMS)
          ASSETS="$RUNNER_TEMP/shinbo-windows-assets"
          mkdir -p "$ASSETS"
          cp "$CANDIDATE/$SETUP" "$ASSETS/Shinbo-$TAG-win32-x64-Setup.exe"
          cp "$CANDIDATE/$NUPKG" "$ASSETS/$NUPKG"
          cp "$CANDIDATE/RELEASES" "$ASSETS/RELEASES"
          (cd "$ASSETS" && shasum -a 256 "Shinbo-$TAG-win32-x64-Setup.exe" "$NUPKG" RELEASES > "Shinbo-$TAG-windows-x64.sha256")

      - uses: actions/setup-node@v5
        if: steps.version.outputs.skip != 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: collect the changelog since the last published release
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          printf '[Download Shinbo for macOS (DMG)](https://github.com/%s/releases/download/%s/Shinbo-%s-darwin-arm64.dmg)\n\nOpen the disk image and drag Shinbo onto Applications. The ZIP asset supports automatic updates.\n\n' "$GITHUB_REPOSITORY" "$TAG" "$TAG" > "$RUNNER_TEMP/shinbo-release-notes.md"
          GITHUB_SHA="$RELEASE_SHA" node desktop/scripts/release-notes.mjs >> "$RUNNER_TEMP/shinbo-release-notes.md"

      - name: setup-zig v2.2.1
        if: steps.version.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.16.0

      - name: install the locked release dependencies
        if: steps.version.outputs.skip != 'true'
        env:
          npm_config_ignore_scripts: ${{ github.event_name == 'workflow_run' }}
        run: npm ci --no-audit --no-fund
        working-directory: desktop

      - if: steps.version.outputs.skip != 'true' && github.event_name == 'workflow_dispatch'
        run: npm run package:mac

      - name: require the Apple signing and notarization credentials
        if: steps.version.outputs.skip != 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for name in MACOS_CERT_P12 MACOS_CERT_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done

      - name: import the Developer ID Application certificate
        if: steps.version.outputs.skip != 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/shinbo-cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/shinbo-signing.keychain-db"
          security set-keychain-settings -lut 21600 "$RUNNER_TEMP/shinbo-signing.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/shinbo-signing.keychain-db"
          security list-keychains -d user -s "$RUNNER_TEMP/shinbo-signing.keychain-db" login.keychain-db
          security import "$RUNNER_TEMP/shinbo-cert.p12" -k "$RUNNER_TEMP/shinbo-signing.keychain-db" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$RUNNER_TEMP/shinbo-signing.keychain-db"
          security find-identity -v -p codesigning "$RUNNER_TEMP/shinbo-signing.keychain-db" | grep 'Developer ID Application:'

      - name: sign and verify the app and all native helpers
        if: steps.version.outputs.skip != 'true'
        working-directory: desktop
        run: |
          npx --no-install electron-osx-sign release/Shinbo-darwin-arm64/Shinbo.app
          codesign --verify --deep --strict --verbose=2 release/Shinbo-darwin-arm64/Shinbo.app

      - name: notarize, staple, and verify Gatekeeper acceptance
        if: steps.version.outputs.skip != 'true'
        env:
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          printf '%s' "$API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/shinbo-api-key.p8"
          ditto -c -k --keepParent desktop/release/Shinbo-darwin-arm64/Shinbo.app "$RUNNER_TEMP/shinbo-notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/shinbo-notarize.zip" --key "$RUNNER_TEMP/shinbo-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/shinbo-notary-result.json"
          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/shinbo-notary-result.json"; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/shinbo-notary-result.json")" --key "$RUNNER_TEMP/shinbo-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            exit 1
          fi
          xcrun stapler staple desktop/release/Shinbo-darwin-arm64/Shinbo.app
          xcrun stapler validate desktop/release/Shinbo-darwin-arm64/Shinbo.app
          spctl --assess --type execute --verbose=2 desktop/release/Shinbo-darwin-arm64/Shinbo.app

      - name: build, sign, notarize and staple the disk image
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          npm run dmg:mac
          DMG="desktop/release/Shinbo-$TAG-darwin-arm64.dmg"
          IDENTITY="$(security find-identity -v -p codesigning "$RUNNER_TEMP/shinbo-signing.keychain-db" | awk -F'"' '/Developer ID Application:/ { print $2; exit }')"
          codesign --sign "$IDENTITY" --keychain "$RUNNER_TEMP/shinbo-signing.keychain-db" --timestamp --force "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/shinbo-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER" --wait --timeout 20m --output-format json > "$RUNNER_TEMP/shinbo-dmg-notary-result.json"
          if ! jq -e '.status == "Accepted"' "$RUNNER_TEMP/shinbo-dmg-notary-result.json"; then
            xcrun notarytool log "$(jq -r '.id' "$RUNNER_TEMP/shinbo-dmg-notary-result.json")" --key "$RUNNER_TEMP/shinbo-api-key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: publish the release with generated notes
        if: steps.version.outputs.skip != 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ditto -c -k --keepParent desktop/release/Shinbo-darwin-arm64/Shinbo.app "Shinbo-$TAG-darwin-arm64.zip"
          cp "desktop/release/Shinbo-$TAG-darwin-arm64.dmg" "Shinbo-$TAG-darwin-arm64.dmg"
          shasum -a 256 "Shinbo-$TAG-darwin-arm64.zip" > "Shinbo-$TAG-darwin-arm64.zip.sha256"
          shasum -a 256 "Shinbo-$TAG-darwin-arm64.dmg" > "Shinbo-$TAG-darwin-arm64.dmg.sha256"
          ASSETS=("Shinbo-$TAG-darwin-arm64.dmg" "Shinbo-$TAG-darwin-arm64.dmg.sha256" "Shinbo-$TAG-darwin-arm64.zip" "Shinbo-$TAG-darwin-arm64.zip.sha256")
          if [ -d "$RUNNER_TEMP/shinbo-windows-assets" ]; then
            for asset in "$RUNNER_TEMP/shinbo-windows-assets"/*; do ASSETS+=("$asset"); done
          fi
          gh release create "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/shinbo-release-notes.md" --latest

      - name: remove the temporary signing credentials
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/shinbo-cert.p12" "$RUNNER_TEMP/shinbo-api-key.p8" "$RUNNER_TEMP/shinbo-notarize.zip" "$RUNNER_TEMP/shinbo-notary-result.json" "$RUNNER_TEMP/shinbo-dmg-notary-result.json"
          if [ -f "$RUNNER_TEMP/shinbo-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/shinbo-signing.keychain-db"
          fi
